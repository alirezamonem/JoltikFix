<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoltikFix | Text Formatter Tool</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e14;
      --bg-gradient: linear-gradient(135deg, #0a0e14 0%, #111827 100%);
      --surface: rgba(30, 41, 59, 0.7);
      --surface-solid: #1e293b;
      --surface-elevated: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f1f5f9;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --surface: rgba(255, 255, 255, 0.8);
      --surface-solid: #ffffff;
      --surface-elevated: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(0, 0, 0, 0.05);
      --shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; transition: all 0.2s ease; }
    body {
      min-height: 100vh; margin: 0; padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient); color: var(--text);
      display: flex; justify-content: center;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 1100px; }
    
    .glass-card {
      background: var(--surface); backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: var(--radius-xl);
      box-shadow: var(--shadow); overflow: hidden;
    }

    /* Header Area */
    header {
      padding: 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 20px; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 15px; }
    .logo-box {
      width: 45px; height: 45px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: grid; place-items: center; color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }
    .stats { display: flex; gap: 10px; }
    .stat-badge {
      background: var(--surface-elevated); padding: 8px 15px;
      border-radius: 30px; font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border);
    }
    .stat-badge span { color: var(--primary); margin-left: 5px; }

    /* Main Grid */
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1.5fr 1fr; } .full-row { grid-column: span 2; } }

    /* Sections */
    .section {
      background: var(--surface-solid); padding: 20px;
      border-radius: var(--radius-lg); border: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 15px;
    }
    .section-header { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .section-header svg { width: 18px; height: 18px; color: var(--primary); }

    /* Input Controls */
    textarea {
      width: 100%; min-height: 250px; padding: 15px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: var(--radius-md); font-size: 1rem; line-height: 1.6; resize: vertical; outline: none;
    }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }
    
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px;
      background: var(--surface-elevated); color: var(--text); border: 1px solid var(--border);
    }
    .btn:hover { transform: translateY(-2px); background: var(--border); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

    input, select {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem;
    }

    /* Generator Box Styles */
    .output-box {
      background: var(--bg); border: 1px dashed var(--border);
      border-radius: var(--radius-md); padding: 15px; font-size: 0.9rem;
      max-height: 150px; overflow-y: auto; white-space: pre-wrap;
    }

        /* Footer Styles */
    footer {
      width: 100%; max-width: 1100px;
      padding: 30px; margin-top: 32px;
      background: var(--surface); backdrop-filter: blur(10px);
      border-radius: var(--radius-xl); border: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .footer-link {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text); font-weight: 500; font-size: 0.9rem;
      padding: 10px 20px; border-radius: 15px; background: var(--surface-elevated);
      border: 1px solid var(--border);
    }
    .footer-link:hover { background: var(--primary); color: white; transform: scale(1.05); }
    .footer-link svg { width: 20px; height: 20px; }

    .footer-link svg {
        width: 18px;
        height: 18px;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      body { padding: 10px; }
      header { flex-direction: column; align-items: center; text-align: center; }
      .toolbar { justify-content: center; }
      .footer-links { flex-direction: column; width: 100%; }
      .footer-link { width: 100%; justify-content: center; }
      .btn { flex: 1 1 120px; justify-content: center; }
    }
  </style>
</head>

          <span style="font-size:0.75rem; color:var(--muted)">Text Formatter Tool - v2.5</span>
        </div>

      <div class="stats">
        <div class="stat-badge">Words <span id="wordCount">0</span></div>
        <div class="stat-badge">Chars <span id="charCount">0</span></div>
        <button class="btn" id="themeBtn" style="border-radius: 50%; width: 42px; height: 42px; padding: 0; justify-content: center;">🌓</button>
      </div>
    </header>

    <div class="grid">
      <!-- MAIN EDITOR SECTION -->
      <div class="section full-row">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Main Text Workspace
        </div>
        <textarea id="mainInput" placeholder="Enter or paste your content here..."></textarea>
        
        <div class="toolbar">
          <button class="btn btn-primary" onclick="doPaste()">Paste</button>
          <button class="btn btn-success" onclick="doCopyAll()">Copy All</button>
          <button class="btn btn-danger" onclick="doClear()">Clear Full Box</button>
        </div>

        <div class="section-header" style="margin-top:10px">Text Case Controls</div>
        <div class="toolbar">
          <button class="btn" onclick="setCase('upper')">UPPERCASE ALL</button>
          <button class="btn" onclick="setCase('lower')">lowercase all</button>
          <button class="btn" onclick="setCase('capitalize')">Capitalize All</button>
          <button class="btn" onclick="setCase('sentence')">Capitalize Sentences</button>
        </div>
      </div>

      <!-- FIND & REPLACE -->
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          Advanced Replace
        </div>
        <input type="text" id="findIn" placeholder="Find text...">
        <div style="display: flex; gap: 8px;">
          <input type="text" id="repIn" placeholder="Replace with..." style="flex:1">
          <button class="btn btn-primary" onclick="findReplace()">Replace</button>
        </div>
        <div class="toolbar">
          <button class="btn" onclick="presetReplace('-')">Space to '-'</button>
          <button class="btn" onclick="presetReplace('_')">Space to '_'</button>
          <button class="btn btn-danger" onclick="presetReplace('')">Remove All Spaces</button>
          <button class="btn btn-warning" onclick="removeMultiSpace()">Remove Multiple Spaces</button>
        </div>
      </div>


      <!-- CHAR REPEATER -->
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 12h10M12 7v10"/></svg>
          Char / Icon Generator
        </div>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="cSym" placeholder="Character..." style="width: 120px;">
          <input type="number" id="cNum" value="10" style="flex:1">
          <button class="btn btn-primary" onclick="genRepeat()">Repeat</button>
        </div>
        <div id="rOut" class="output-box">...</div>
        <div class="toolbar">
          <button class="btn" style="flex:1" onclick="copyOut('rOut')">Copy</button>
          <button class="btn" style="flex:1" onclick="insertToMain('rOut')">Insert</button>
        </div>
      </div>



      <!-- LOREM GENERATOR -->
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16M4 16h16M4 12h16M4 8h16M4 4h16"/></svg>
          Lorem Ipsum Generator
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <select id="lLang">
            <option value="en">English (Global)</option>
            <option value="fa">Persian (پارسی)</option>
          </select>
          <select id="lType">
            <option value="para">Paragraphs</option>
            <option value="sent">Sentences</option>
            <option value="word">Words</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px;">
          <input type="number" id="lCount" value="3" min="1" style="flex:1">
          <button class="btn btn-primary" onclick="genLorem()">Generate</button>
          <button class="btn btn-purple" onclick="genRandom()">🎲</button>
        </div>
        <div id="lOut" class="output-box" dir="ltr">...</div>
        <div class="toolbar">
          <button class="btn" style="flex:1" onclick="copyOut('lOut')">Copy</button>
          <button class="btn" style="flex:1" onclick="insertToMain('lOut')">Insert</button>
        </div>
      </div>

      <!-- WORD FREQUENCY -->
      <div class="section">
        <div class="section-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83M22 12A10 10 0 0 0 12 2v10z"/></svg>
          Word Frequency
        </div>
        <button class="btn btn-purple" onclick="calcFreq()">Analyze & Clean Frequency</button>
        <div id="fOut" class="output-box" style="font-family: monospace;">No analysis yet.</div>
      </div>

    </div>
  </div>
</div>

<script>
  const main = document.getElementById('mainInput');
  
  // Stats
  main.addEventListener('input', () => {
    document.getElementById('charCount').textContent = main.value.length;
    document.getElementById('wordCount').textContent = main.value.trim() ? main.value.trim().split(/\s+/).length : 0;
  });

  // Theme Toggle
  document.getElementById('themeBtn').addEventListener('click', () => {
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  });

  // به‌روزرسانی خودکار سال در فوتر
  document.getElementById('year').textContent = new Date().getFullYear();

  // apitalize Sentences
  function capitalizeSentences(text) {
      text = text.toLowerCase();
      return text.replace(/(^\s*\w|[.!?]\s+\w|[\r\n]+\s*\w)/g, function(match) {
          return match.toUpperCase();
      });
  }

  // Formatting
  function setCase(m) {
    let t = main.value;
    if(m === 'upper') t = t.toUpperCase();
    if(m === 'lower') t = t.toLowerCase();
    if(m === 'capitalize') t = t.replace(/\b\w/g, c => c.toUpperCase());
    // if(m === 'sentence') t = t.toLowerCase().replace(/(^\s*\w|[\.\!\?]\s*\w)/g, c => c.toUpperCase());
    if(m === 'sentence') t = capitalizeSentences(t);
    
    main.value = t;
    main.dispatchEvent(new Event('input'));
  }

  // Basic Actions
  function doClear() { main.value = ''; main.dispatchEvent(new Event('input')); }
  
  
  // async function doPaste() { main.value += await navigator.clipboard.readText(); main.dispatchEvent(new Event('input')); }
  // Smart Paste Function
  async function doPaste() {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        main.value += text;
        main.dispatchEvent(new Event('input'));
      }
    } catch (err) {
      // Fallback for browsers with strict security
      alert("Please use Ctrl+V (or Cmd+V) to paste directly into the box.");
      main.focus();
    }
  }

  function doCopyAll() { navigator.clipboard.writeText(main.value); }

  // Search/Replace
  function findReplace() {
    const f = document.getElementById('findIn').value;
    const r = document.getElementById('repIn').value;
    main.value = main.value.split(f).join(r);
    main.dispatchEvent(new Event('input'));
  }

  function presetReplace(val) {
    main.value = main.value.replace(/\s/g, val);
    main.dispatchEvent(new Event('input'));
  }

  function removeMultiSpace() {
    main.value = main.value.replace(/\s+/g, ' ').trim();
    main.dispatchEvent(new Event('input'));
  }

  // Lorem Ipsum Data
  const lData = {
    en: {
      p: ["Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.","Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.","Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur."],
      w: "lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor".split(' ')
    },
    fa: {
      p: ["لورم ایپسوم متن ساختگی با تولید سادگی نامفهوم از صنعت چاپ و با استفاده از طراحان گرافیک است.","چاپگرها و متون بلکه روزنامه و مجله در ستون و سطرآنچنان که لازم است و برای شرایط فعلی تکنولوژی مورد نیاز است.","طرح‌نما یا لورم ایپسوم به متنی آزمایشی و بی‌معنی در صنعت چاپ، صفحه‌آرایی و طراحی گرافیک گفته می‌شود."],
      w: "لورم ایپسوم متن ساختگی تولید سادگی نامفهوم صنعت چاپ طراحان گرافیک".split(' ')
    }
  };

  function genLorem() {
    const lang = document.getElementById('lLang').value;
    const type = document.getElementById('lType').value;
    const count = parseInt(document.getElementById('lCount').value);
    const out = document.getElementById('lOut');
    out.dir = lang === 'fa' ? 'rtl' : 'ltr';
    let res = "";

    if(type === 'para') for(let i=0; i<count; i++) res += lData[lang].p[i % 3] + "\n\n";
    else if(type === 'sent') for(let i=0; i<count; i++) res += lData[lang].p[0].split('.')[i%2] + ". ";
    else for(let i=0; i<count; i++) res += lData[lang].w[i % lData[lang].w.length] + " ";

    out.textContent = res.trim();
  }

  function genRandom() {
    document.getElementById('lLang').value = Math.random() > 0.5 ? 'en' : 'fa';
    document.getElementById('lType').value = ['para','sent','word'][Math.floor(Math.random()*3)];
    document.getElementById('lCount').value = Math.floor(Math.random()*5)+1;
    genLorem();
  }

  // Utils
  function copyOut(id) { navigator.clipboard.writeText(document.getElementById(id).textContent); }
  function insertToMain(id) { main.value += "\n" + document.getElementById(id).textContent; main.dispatchEvent(new Event('input')); }
  
  function genRepeat() {
    const s = document.getElementById('cSym').value || '*';
    const n = document.getElementById('cNum').value;
    document.getElementById('rOut').textContent = s.repeat(n);
  }

  function calcFreq() {
    const words = main.value.toLowerCase().match(/\b\w+\b/g);
    if(!words) return;
    const f = {};
    words.forEach(w => f[w] = (f[w] || 0) + 1);
    let report = Object.entries(f).sort((a,b) => b[1] - a[1]).map(e => `${e[0]}: ${e[1]}`).join('\n');
    document.getElementById('fOut').textContent = report;
    // Remove duplicates from main
    main.value = [...new Set(words)].join(' ');
    main.dispatchEvent(new Event('input'));
  }
</script>
